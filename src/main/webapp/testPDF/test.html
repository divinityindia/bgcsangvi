<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
<script language="javascript" type="text/javascript" src="../js/jquery-1.9.1.js"></script>
<script type="text/javascript" src="../testPDF/jspdf.min.js"></script>
<script type="text/javascript" src="../testPDF/jspdf.plugin.autotable.js"></script>
<script type="text/javascript" src="../testPDF/jquery.blockUI.js"></script>


<script>
		function f1(){

			var doc = new jsPDF();

			doc.text(20, 20, 'This is the default font.');

			doc.setFont("courier");
			doc.setFontType("normal");
			doc.text(20, 30, 'This is courier normal.');

			doc.setFont("times");
			doc.setFontType("italic");
			doc.text(20, 40, 'This is times italic.');

			doc.setFont("helvetica");
			doc.setFontType("bold");
			doc.text(20, 50, 'This is helvetica bold.');

			doc.setFont("courier");
			doc.setFontType("bolditalic");
			doc.text(20, 60, 'This is courier bolditalic.');

			doc.setFont("times");
			doc.setFontType("normal");
			doc.text(105, 80, 'This is centred text.', null, null, 'center');
			doc.text(105, 90, 'And a little bit more underneath it.', null, null, 'center');
			doc.text(200, 100, 'This is right aligned text', null, null, 'right');
			doc.text(200, 110, 'And some more', null, null, 'right');
			doc.text(20, 120, 'Back to left');




					doc.save('samples.pdf');
		}

</script>

</head>
<body>


	<button onclick="f1()">Ok</button>



</body>
</html>
